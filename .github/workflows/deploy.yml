name: Deploy to Vercel and HF Spaces

on:
  push:
    branches:
      - hf  # Deploy when pushing to hf branch
  workflow_dispatch:  # Allow manual deployment

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Vercel CLI
        run: npm install -g vercel
        
      - name: Deploy to Vercel
        run: |
          cd frontend
          vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    name: Deploy Backend to HF Spaces (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'  # Only run manually
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Hugging Face CLI
        run: |
          pip install huggingface_hub
          
      - name: Deploy to HF Spaces
        run: |
          # Note: This is a placeholder - HF Spaces deployment is typically done
          # by pushing to the HF Spaces git repository or through the web interface
          echo "Backend deployment to HF Spaces should be done manually"
          echo "1. Create a new Space at https://huggingface.co/spaces"
          echo "2. Choose Docker as the SDK"
          echo "3. Push the backend files (app.py, Dockerfile, requirements_hf.txt, etc.)"
          echo "4. Update the API URL in the frontend configuration"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  test-integration:
    name: Test Frontend-Backend Integration
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Test API connectivity
        run: |
          # Simple test to check if the backend API is accessible
          # Replace with your actual HF Spaces URL
          API_URL="https://paranoiid-streaming-digit-classifier.hf.space"
          
          echo "Testing API health endpoint..."
          curl -f "$API_URL/api/health" || echo "API health check failed"
          
          echo "Testing processors endpoint..."  
          curl -f "$API_URL/api/processors" || echo "Processors endpoint failed"